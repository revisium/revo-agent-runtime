name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native_verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Native process PoC
        run: pnpm poc:platform

      - name: Verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify

      - name: Inspect package after a failed native verification
        if: ${{ failure() && steps.install.outcome == 'success' }}
        run: pnpm verify:package

      - name: SonarQube branch scan
        if: ${{ matrix.os == 'ubuntu-24.04' && env.SONAR_TOKEN != '' && github.event_name != 'pull_request' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: SonarQube PR Quality Gate
        if: ${{ matrix.os == 'ubuntu-24.04' && env.SONAR_TOKEN != '' && github.event_name == 'pull_request' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Inspect Sonar open issues
        if: ${{ always() && !cancelled() && matrix.os == 'ubuntu-24.04' && env.SONAR_TOKEN != '' && github.event_name == 'pull_request' }}
        run: pnpm sonar:issues:local

  verify:
    name: verify
    needs: [native_verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native verification job
        env:
          NATIVE_RESULT: ${{ needs.native_verify.result }}
        run: test "$NATIVE_RESULT" = success
