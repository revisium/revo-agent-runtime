sonar.projectKey=revisium_revo-agent-runtime
sonar.organization=revisium
sonar.projectName=revo-agent-runtime
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=dist/**,coverage/**,node_modules/**,**/generated/**,**/fixtures/**
sonar.coverage.exclusions=test/**,scripts/**,src/platform/node/process/darwin.ts,src/platform/node/process/platform.ts,src/platform/node/process/windows/bindings.ts,src/platform/node/process/windows/bootstrap.ts,src/platform/node/process/windows/launcher.ts,src/platform/node/process/windows/recovery.ts,src/platform/node/process/windows/wait.ts,src/platform/node/output/windows/native.ts,src/platform/node/output/platform.ts
sonar.cpd.exclusions=test/**,**/generated/**,**/fixtures/**
