sonar.projectKey=revisium_revo-agent-runtime
sonar.organization=revisium
sonar.projectName=revo-agent-runtime
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=dist/**,coverage/**,node_modules/**,**/generated/**,**/fixtures/**
# Temporary through session-engine M10; functional session tests still run in every verify.
sonar.coverage.exclusions=test/**,scripts/**,src/application/session/admission/**,src/application/session/handles/**,src/application/session/management/**,src/composition/session/**,src/execution/session/**,src/platform/node/output/session/**,src/platform/node/security/digest.ts,src/platform/node/session/primitives/**,src/protocol/acp/session/**
sonar.cpd.exclusions=test/**,**/generated/**,**/fixtures/**
